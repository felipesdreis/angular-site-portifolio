<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Extras</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0F0D13;
      color: #E6E1E5;
      font-family: Roboto, sans-serif;
    }
    main { width: 100%; max-width: 420px; }
    h1 { font-size: 28px; margin-bottom: 24px; }
    nav { display: grid; gap: 12px; }
    a {
      display: block;
      padding: 16px 20px;
      border: 1px solid #2B2930;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, background .15s;
    }
    a:hover, a:focus-visible { border-color: #3FBE4D; background: #1A1820; outline: none; }
    a strong { display: block; color: #B6F2A4; font-weight: 500; }
    a span { font-size: 14px; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>Extras</h1>
    <!-- Nova página: crie src/assets/<nome>/index.html, adicione o rewrite no vercel.json e um <a> aqui -->
    <nav>
      <a href="/grease"><strong>Grease the Groove</strong><span>Tracker de séries ao longo do dia</span></a>
      <a href="/ride-planner"><strong>Ride Planner</strong><span>Criador de rotas com export GPX</span></a>
      <a href="/territorios"><strong>Gerador de Territórios</strong><span>Editor de cartões de território</span></a>
      <a href="/locked-in"><strong>Locked In</strong><span>Landing page</span></a>
    </nav>
  </main>
</body>
</html>
